version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      kotlin-and-agp:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.android.tools.build*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
      quality-tools:
        patterns:
          - "com.diffplug.spotless*"
          - "dev.detekt*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
