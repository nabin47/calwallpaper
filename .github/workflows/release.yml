name: Release

# Builds a signed APK + AAB for a vMAJOR.MINOR.PATCH tag and publishes them to the GitHub Release.
# Works both ways (docs/release.md):
#   - push a tag            -> creates the Release
#   - create the Release in the GitHub web UI (with a new tag) -> uploads assets to that Release
# If both events fire for the same tag, the second run sees the assets and skips.
on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.0.1"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH (e.g. v0.0.1)."
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 || major > 2099 )); then
            echo "::error::minor/patch must be <= 999 and major <= 2099 to fit versionCode."
            exit 1
          fi
          code=$(( major * 1000000 + minor * 1000 + patch ))
          if (( code < 1 )); then
            echo "::error::v0.0.0 cannot be released (versionCode must be >= 1)."
            exit 1
          fi
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=${code}" >> "$GITHUB_OUTPUT"
          echo "versionName=${TAG#v} versionCode=${code}"

      - name: Skip if assets already published
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]] && grep -qx "CalWallpaper-${TAG}.apk" <<< "$assets"; then
            echo "Release $TAG already has its assets; skipping duplicate run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION_NAME: ${{ needs.plan.outputs.version_name }}
      VERSION_CODE: ${{ needs.plan.outputs.version_code }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Check signing secrets
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]} (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "SIGNING_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Checks (spotless, detekt, lint, tests)
        run: ./gradlew spotlessCheck detekt lint check

      - name: Build signed APK and AAB
        run: >-
          ./gradlew :app:assembleRelease :app:bundleRelease
          -Pcalwp.versionName="${VERSION_NAME}"
          -Pcalwp.versionCode="${VERSION_CODE}"

      - name: Verify APK signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::Signed APK not found (unsigned build?)"; ls -R app/build/outputs/apk; exit 1; }
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Stage assets
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CalWallpaper-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/CalWallpaper-${TAG}.aab"
          (cd dist && sha256sum CalWallpaper-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Generate release notes
        run: .github/scripts/release-notes.sh "$TAG" > release-notes.md && cat release-notes.md

      - name: Publish GitHub Release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            body="$(gh release view "$TAG" --json body --jq .body)"
            if [[ -z "${body//[[:space:]]/}" ]]; then
              gh release edit "$TAG" --notes-file release-notes.md
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "CalWallpaper ${TAG}" --notes-file release-notes.md
          fi

      - name: Upload R8 mapping (private, for crash deobfuscation)
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-${{ env.TAG }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Job summary
        run: |
          {
            echo "### 🚀 Released ${TAG}"
            echo
            echo "versionName \`${VERSION_NAME}\` · versionCode \`${VERSION_CODE}\`"
            echo
            echo "| Asset | Size |"
            echo "|---|---|"
            for f in dist/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
