name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI_LOG_DIR: ${{ github.workspace }}/.ci-logs
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # No signing secrets here: this job runs PR code. Release signing happens only in release.yml.
      - name: Spotless
        run: .github/scripts/run-step.sh "Spotless" ./gradlew spotlessCheck

      - name: Detekt
        run: .github/scripts/run-step.sh "Detekt" ./gradlew detekt

      - name: Android Lint
        run: .github/scripts/run-step.sh "Android Lint" ./gradlew lint

      - name: Unit tests
        run: .github/scripts/run-step.sh "Unit tests" ./gradlew check

      - name: Assemble debug APK
        run: .github/scripts/run-step.sh "Assemble debug APK" ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: calwallpaper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo "### ✅ CI passed"
            echo
            echo "Debug APK: see **Artifacts** → \`calwallpaper-debug-apk\` on this run."
            echo "APK size: $(du -h app/build/outputs/apk/debug/*.apk | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build failure report
        if: failure()
        run: .github/scripts/failure-report.sh

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-report
          path: .ci-logs/report.md
          include-hidden-files: true
          retention-days: 7

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: "**/build/reports/**"
          retention-days: 7

  # Posts or updates one PR comment with the failing step and log tail. Runs without checking out
  # PR code and only for same-repo PRs, so it is fork-safe; it holds the only write permission.
  report:
    name: Report to PR
    needs: build
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Download failure report
        if: needs.build.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ci-failure-report
          path: report

      - name: Post or update PR comment
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- calwp-ci-report -->'
          run_url="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          mkdir -p report
          case "$BUILD_RESULT" in
            failure)
              if [[ ! -f report/report.md ]]; then
                printf '%s\n### ❌ CI failed\n\nNo report was produced; see the [run log](%s).\n' "$marker" "$run_url" > report/report.md
              fi
              create=true ;;
            success)
              printf '%s\n### ✅ CI is green again\n\nCommit `%s` passed all checks.\n' "$marker" "${HEAD_SHA:0:7}" > report/report.md
              create=false ;;
            *)
              echo "Build result: $BUILD_RESULT; nothing to report."; exit 0 ;;
          esac
          comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" | head -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" -F "body=@report/report.md" > /dev/null
            echo "Updated comment ${comment_id}"
          elif [[ "$create" == "true" ]]; then
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F "body=@report/report.md" > /dev/null
            echo "Created comment"
          else
            echo "No earlier failure comment; nothing to update."
          fi
