name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI_LOG_DIR: ${{ github.workspace }}/.ci-logs
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # No release signing secrets here: this job runs PR code. Release signing happens only in release.yml.
      # The one secret this job sees is the debug-only key, and only in "Assemble debug APK" (ADR 0006).
      - name: Spotless
        run: .github/scripts/run-step.sh "Spotless" ./gradlew spotlessCheck

      - name: Detekt
        run: .github/scripts/run-step.sh "Detekt" ./gradlew detekt

      - name: Android Lint
        run: .github/scripts/run-step.sh "Android Lint" .github/scripts/lint.sh

      - name: Unit tests
        run: .github/scripts/run-step.sh "Unit tests" ./gradlew check

      - name: Screenshot tests
        run: .github/scripts/run-step.sh "Screenshot tests" ./gradlew verifyRoborazziDebug

      - name: Room schema is committed
        run: .github/scripts/run-step.sh "Room schema is committed" .github/scripts/check-room-schemas.sh

      - name: Assemble debug APK
        env:
          # A debug-only key (never the release key), so each CI build installs over the last (ADR 0006).
          # Empty for fork PRs; the build then falls back to a throwaway debug key.
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: .github/scripts/run-step.sh "Assemble debug APK" .github/scripts/assemble-debug.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: calwallpaper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Unsigned release build: proves R8 keeps everything the app needs and measures the shipped size
      # (docs/performance.md). No signing secrets here; this job runs PR code.
      - name: Release build size
        run: .github/scripts/run-step.sh "Release build size" ./gradlew :app:assembleRelease

      - name: Job summary
        run: |
          {
            echo "### ✅ CI passed"
            echo
            echo "Debug APK: see **Artifacts** → \`calwallpaper-debug-apk\` on this run."
            echo
            echo "| APK | Size (bytes) |"
            echo "|---|---|"
            for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              echo "| \`$(basename "$apk")\` | $(stat -c %s "$apk") |"
            done
            # Permissions of the shipped (release) APK after manifest merging, so library-added ones are visible
            # in every PR (CLAUDE.md §7).
            echo
            echo "Permissions in the release APK:"
            echo
            aapt2="$( (ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null || true) | sort -V | tail -n 1)aapt2"
            "$aapt2" dump permissions app/build/outputs/apk/release/*.apk | grep 'uses-permission' | sed 's/^/- /' \
              || echo "- (could not read permissions)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build failure report
        if: failure()
        run: .github/scripts/failure-report.sh

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-report
          path: .ci-logs/report.md
          include-hidden-files: true
          retention-days: 7

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          # Test/lint reports, plus Roborazzi's expected/actual/diff images when screenshots differ.
          path: |
            **/build/reports/**
            **/build/outputs/roborazzi/**
          retention-days: 7

  # Posts or updates one PR comment with the failing step and log tail. Runs without checking out
  # PR code and only for same-repo PRs, so it is fork-safe; it holds the only write permission.
  report:
    name: Report to PR
    needs: build
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Download failure report
        if: needs.build.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ci-failure-report
          path: report

      - name: Post or update PR comment
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- calwp-ci-report -->'
          run_url="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          mkdir -p report
          case "$BUILD_RESULT" in
            failure)
              if [[ ! -f report/report.md ]]; then
                printf '%s\n### ❌ CI failed\n\nNo report was produced; see the [run log](%s).\n' "$marker" "$run_url" > report/report.md
              fi
              create=true ;;
            success)
              printf '%s\n### ✅ CI is green again\n\nCommit `%s` passed all checks.\n' "$marker" "${HEAD_SHA:0:7}" > report/report.md
              create=false ;;
            *)
              echo "Build result: $BUILD_RESULT; nothing to report."; exit 0 ;;
          esac
          comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" | head -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" -F "body=@report/report.md" > /dev/null
            echo "Updated comment ${comment_id}"
          elif [[ "$create" == "true" ]]; then
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F "body=@report/report.md" > /dev/null
            echo "Created comment"
          else
            echo "No earlier failure comment; nothing to update."
          fi
