name: Record screenshots

# Re-records the golden images of the Roborazzi screenshot tests and commits them to the branch, then starts
# CI on that commit. Use it after an intentional visual change:
#   Actions -> Record screenshots -> Run workflow -> "Use workflow from": your PR branch (never main).
# Pushing a commit whose message contains [record-screenshots] does the same.
# It runs the branch's own code with write access, like any push by a collaborator; forks cannot trigger it.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record and commit
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[record-screenshots]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Record goldens
        run: ./gradlew recordRoborazziDebug

      - name: Commit changed screenshots
        id: commit
        run: |
          git add -A -- '*/src/test/screenshots/*.png'
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "test: record screenshot goldens"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not start workflows, so start CI explicitly for the new commit.
      - name: Run CI on the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Screenshot goldens"
            echo
            if [[ "${{ steps.commit.outputs.pushed }}" == "true" ]]; then
              echo "Recorded and committed to \`${GITHUB_REF_NAME}\`. CI was started on the new commit."
            else
              echo "No changes to commit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
