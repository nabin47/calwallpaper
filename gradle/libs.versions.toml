# Versions verified on 2026-10-16. See PLAN.md §3 for sources. Dependabot keeps them current.
[versions]
agp = "9.4.0"
kotlin = "2.4.21"
spotless = "8.10.4"
ktlint = "1.8.0"
detekt = "2.0.0-alpha.6"
composeBom = "2026.09.00"
activity = "1.13.0"
junit4 = "4.13.2"
ksp = "2.3.12"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
room3 = "3.0.3"
sqlite = "2.7.1"
datastore = "1.2.1"
roborazzi = "1.76.0"
robolectric = "4.17"
annotation = "1.11.0"
# Latest stable on developer.android.com/jetpack/androidx/releases/glance (verified 2026-10-17).
glance = "1.2.0"
# Latest stable on Maven Central (verified 2026-10-17). Todoist API v1 client (CLAUDE.md §3).
ktor = "3.6.0"
# Latest stable on developer.android.com/jetpack/androidx/releases/work (verified 2026-10-17).
work = "2.12.0"
# Latest stable on developer.android.com/jetpack/androidx/releases/benchmark (verified 2026-10-17). The Baseline
# Profile Gradle plugin is released with it; 1.5.0 is the first stable that supports AGP 9's new DSL.
benchmark = "1.5.0"
# Latest stable on developer.android.com/jetpack/androidx/releases/profileinstaller (verified 2026-10-17).
profileinstaller = "1.4.1"
# Latest stable on developer.android.com/jetpack/androidx/releases/test-uiautomator (verified 2026-10-17).
uiautomator = "2.4.0"
# Latest stable on developer.android.com/jetpack/androidx/releases/test (verified 2026-10-17).
androidxTestExtJunit = "1.3.0"

# Android SDK levels (read by build-logic and module scripts).
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "26"

[libraries]
# Build-logic only (Gradle plugins on the convention classpath).
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kotlin-serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
roborazzi-gradlePlugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }
# Plugin marker artifact (always <plugin id>:<plugin id>.gradle.plugin); it depends on the implementation.
room3-gradlePlugin = { module = "androidx.room3:androidx.room3.gradle.plugin", version.ref = "room3" }
baselineprofile-gradlePlugin = { module = "androidx.baselineprofile:androidx.baselineprofile.gradle.plugin", version.ref = "benchmark" }

# Shared (KMP) dependencies.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# Data layer.
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }

# Network (Todoist) and background sync.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }

# Widgets.
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }

# App dependencies.
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }

# Tests.
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
